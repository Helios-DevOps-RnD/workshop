<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivere Hotel - Mini Guest Reception App</title>
    <style>
        :root {
            --ink: #18212f;
            --muted: #667085;
            --line: #dde4ee;
            --paper: #fbf8f1;
            --panel: #ffffff;
            --navy: #17324d;
            --teal: #087e8b;
            --gold: #c88719;
            --red: #b42318;
            --green: #087443;
            --shadow: 0 18px 45px rgba(23, 50, 77, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            background:
                radial-gradient(circle at top left, rgba(8, 126, 139, 0.20), transparent 34rem),
                linear-gradient(135deg, #f8efe0 0%, #eef5f7 55%, #f9fbff 100%);
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        #app {
            width: min(1240px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 54px;
        }

        .login-card {
            width: min(480px, 100%);
            margin: 7vh auto;
            padding: 34px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .brand-mark {
            display: grid;
            width: 54px;
            height: 54px;
            margin-bottom: 18px;
            place-items: center;
            border-radius: 18px;
            color: white;
            background: var(--navy);
            font-size: 28px;
            font-weight: 700;
        }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--teal);
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1,
        h2,
        h3 {
            margin: 0;
            color: var(--navy);
        }

        .login-copy {
            color: var(--muted);
            line-height: 1.5;
        }

        .stack,
        .guest-form {
            display: grid;
            gap: 14px;
        }

        label {
            display: grid;
            gap: 7px;
            color: var(--navy);
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 13px;
            font-weight: 800;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px 13px;
            color: var(--ink);
            background: white;
        }

        textarea {
            resize: vertical;
        }

        .btn {
            border: 0;
            border-radius: 999px;
            padding: 11px 16px;
            cursor: pointer;
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 13px;
            font-weight: 800;
        }

        .btn-primary {
            color: white;
            background: var(--navy);
        }

        .btn-secondary {
            color: var(--navy);
            background: #e4eff2;
        }

        .btn-ghost {
            color: var(--navy);
            background: transparent;
            border: 1px solid var(--line);
        }

        .btn-danger {
            color: white;
            background: var(--red);
        }

        .btn-warning {
            color: white;
            background: var(--gold);
        }

        .demo-users {
            display: grid;
            gap: 6px;
            margin-top: 18px;
            padding: 14px;
            border-radius: 18px;
            color: var(--muted);
            background: #f4f7f8;
            font-size: 13px;
        }

        .app-header,
        .panel,
        .metric-card,
        .activity-card,
        .toolbar,
        .drawer-card {
            border: 1px solid rgba(255, 255, 255, 0.72);
            background: rgba(255, 255, 255, 0.86);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 22px 24px;
            border-radius: 28px;
        }

        .header-actions,
        .admin-row,
        .drawer-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .mode-pill,
        .user-pill {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            border-radius: 999px;
            padding: 8px 13px;
            color: var(--navy);
            background: #fff6dc;
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 13px;
            font-weight: 800;
        }

        .user-pill {
            background: #ecf6f7;
        }

        .app-layout {
            display: grid;
            gap: 18px;
            margin-top: 18px;
        }

        .admin-row {
            justify-content: flex-end;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(130px, 1fr));
            gap: 14px;
        }

        .metric-card,
        .activity-card,
        .panel,
        .toolbar {
            border-radius: 24px;
        }

        .metric-card {
            display: grid;
            gap: 12px;
            min-height: 132px;
            padding: 20px;
        }

        .metric-card span,
        .panel-heading p,
        .activity-card li span {
            color: var(--muted);
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 13px;
        }

        .metric-card strong {
            font-size: 38px;
            line-height: 1;
        }

        .tone-total {
            background: #ffffff;
        }

        .tone-reserved {
            background: #fff6dc;
        }

        .tone-in {
            background: #e7f7ef;
        }

        .tone-out {
            background: #edf2f7;
        }

        .tone-flagged {
            background: #fff0ee;
        }

        .activity-card {
            grid-column: span 2;
            padding: 20px;
        }

        .activity-card ul {
            display: grid;
            gap: 10px;
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
        }

        .activity-card li {
            display: grid;
            gap: 3px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 170px 180px 170px auto;
            gap: 12px;
            padding: 16px;
        }

        .panel {
            padding: 18px;
        }

        .panel-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 14px;
        }

        th,
        td {
            border-bottom: 1px solid var(--line);
            padding: 12px 10px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .link-button {
            border: 0;
            padding: 0;
            color: var(--teal);
            background: transparent;
            cursor: pointer;
            font-weight: 800;
        }

        .status-badge,
        .flag-badge {
            display: inline-flex;
            border-radius: 999px;
            padding: 5px 9px;
            color: var(--navy);
            background: #edf2f7;
            font-size: 12px;
            font-weight: 800;
        }

        .status-checked-in {
            color: var(--green);
            background: #e7f7ef;
        }

        .status-checked-out {
            color: #475467;
            background: #edf2f7;
        }

        .status-flagged {
            color: var(--red);
            background: #fff0ee;
        }

        .status-reserved {
            color: #8a5a00;
            background: #fff6dc;
        }

        .muted {
            color: var(--muted);
        }

        .guest-form {
            grid-template-columns: repeat(3, minmax(160px, 1fr));
        }

        .guest-form .wide {
            grid-column: 1 / -1;
        }

        .detail-drawer {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: flex-end;
            background: rgba(24, 33, 47, 0.28);
            z-index: 20;
        }

        .detail-drawer.open {
            display: flex;
        }

        .drawer-card {
            width: min(510px, 100%);
            height: 100%;
            overflow-y: auto;
            padding: 28px;
            border-radius: 28px 0 0 28px;
            animation: slideIn 180ms ease-out;
        }

        .drawer-close {
            float: right;
            border: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            background: #edf2f7;
            font-size: 24px;
            line-height: 1;
        }

        .detail-meta,
        .detail-list {
            display: grid;
            gap: 10px;
            margin: 18px 0;
        }

        .detail-meta {
            grid-template-columns: repeat(3, auto);
            justify-content: start;
        }

        .detail-list {
            grid-template-columns: 130px 1fr;
            padding: 16px;
            border-radius: 18px;
            background: #f7fafc;
        }

        .detail-list dt {
            color: var(--muted);
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 12px;
            font-weight: 800;
        }

        .detail-list dd {
            margin: 0;
        }

        .note-preview {
            min-height: 72px;
            margin: 10px 0 16px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            line-height: 1.45;
        }

        .alert,
        .form-errors,
        .toast {
            border-radius: 16px;
            padding: 12px 14px;
            font-family: 'Trebuchet MS', Verdana, sans-serif;
            font-size: 13px;
            font-weight: 800;
        }

        .alert-error,
        .form-errors {
            color: var(--red);
            background: #fff0ee;
        }

        .alert-warning {
            color: #8a5a00;
            background: #fff6dc;
        }

        .empty-state {
            color: var(--muted);
            text-align: center;
        }

        @keyframes slideIn {
            from {
                transform: translateX(30px);
                opacity: 0.65;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 960px) {
            .app-header,
            .panel-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .dashboard-grid,
            .toolbar,
            .guest-form {
                grid-template-columns: 1fr;
            }

            .activity-card {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <div id="appMessage" class="toast" aria-live="polite"></div>
    <div id="app"></div>

    <script src="data/seed.js"></script>
    <script src="data/storage.js"></script>
    <script src="data/audit.js"></script>
    <script src="domain/validation.js"></script>
    <script src="domain/authService.js"></script>
    <script src="domain/guestService.js"></script>
    <script src="security/safeRender.js"></script>
    <script src="security/vulnerableRender.js"></script>
    <script src="security/trainingMode.js"></script>
    <script src="ui/templates.js"></script>
    <script src="ui/components.js"></script>
    <script src="ui/render.js"></script>
    <script src="controllers/authController.js"></script>
    <script src="controllers/guestController.js"></script>
    <script src="controllers/auditController.js"></script>
    <script src="app/main.js"></script>
</body>
</html>
