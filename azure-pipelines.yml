# Azure DevOps pipeline
# Runs unit tests only, then stops.

trigger:
  branches:
    include:
      - staging
      - main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: npm ci
  displayName: 'Install dependencies'

- script: npm test
  displayName: 'Run unit tests (jest)'